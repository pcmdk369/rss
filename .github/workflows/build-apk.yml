name: Android CI and Release Validation

on:
  push:
    branches: [main, master, production-readiness]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Prepare private release keystore
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/superioa-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/superioa-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Build signed Play Store bundle
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify APKs and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          mkdir -p artifacts
          cp "$DEBUG_APK" artifacts/superioa-debug.apk
          cp "$RELEASE_APK" artifacts/superioa-release.apk
          if [ "$RELEASE_SIGNING_ENABLED" = "true" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
            cp app/build/outputs/bundle/release/*.aab artifacts/superioa-release.aab
          else
            echo "Release APK is unsigned; validation artifact only."
          fi
          (cd artifacts && sha256sum *.apk *.aab 2>/dev/null > SHA256SUMS.txt || sha256sum *.apk > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperiOA-debug-apk
          path: artifacts/superioa-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK and Play bundle
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SuperiOA-release-signed
          path: |
            artifacts/superioa-release.apk
            artifacts/superioa-release.aab
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release validation APK
        if: env.RELEASE_SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SuperiOA-release-unsigned-validation
          path: |
            artifacts/superioa-release.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuperiOA-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
